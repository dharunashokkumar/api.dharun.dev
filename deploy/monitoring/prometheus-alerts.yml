# Alert rules for the API. Load it from prometheus.yml:
#
#   rule_files:
#     - dharun-api-alerts.yml
#
# Stale or failing data never takes the API down: the copy in use keeps being served.
# These tell you it has stopped getting newer.
groups:
  - name: dharun-api
    rules:
      - alert: DharunApiDown
        expr: up{job="dharun-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: api.dharun.dev is not answering its metrics port
          description: Prometheus has not been able to scrape the API for five minutes.

      # At least 20 requests in the window, or one 503 among a handful would count.
      - alert: DharunApiErrors
        expr: |
          sum(rate(api_http_requests_total{job="dharun-api",status=~"5.."}[10m]))
            / sum(rate(api_http_requests_total{job="dharun-api"}[10m])) > 0.05
          and on() sum(increase(api_http_requests_total{job="dharun-api"}[10m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API responses are server errors

      # A failed source is retried after six hours (sooner for the hourly space weather),
      # so this is at least two failures in a row.
      - alert: DharunApiRefreshFailing
        expr: api_dataset_refresh_ok{job="dharun-api"} == 0
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: 'Refresh of {{ $labels.dataset }} keeps failing'
          description: >-
            The last refresh attempts failed or were held back by a sanity check. See
            `journalctl -u dharun-api-refresh` and /var/lib/dharun-api/data/refresh.json.

      # Three refresh intervals without one that worked: 12 hours for mutual fund NAV,
      # three weeks for IFSC, three months for the monthly datasets.
      - alert: DharunApiDataStale
        expr: |
          (time() - api_dataset_refresh_success_timestamp_seconds{job="dharun-api"})
            > 3 * on (dataset, instance) api_dataset_refresh_interval_seconds{job="dharun-api"}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.dataset }} has not been refreshed for three intervals'
          description: Check that dharun-api-refresh.timer is active and that the source is reachable.

      # A dataset the server refreshes, and no refresh has ever worked here.
      - alert: DharunApiNeverRefreshed
        expr: |
          api_dataset_refresh_interval_seconds{job="dharun-api"}
            unless on (dataset, instance) api_dataset_refresh_success_timestamp_seconds{job="dharun-api"}
        for: 2d
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.dataset }} has never been refreshed on this server'

      - alert: DharunApiDatasetMissing
        expr: api_dataset_available{job="dharun-api"} == 0
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: 'The server has no copy of {{ $labels.dataset }}'
          description: Its endpoints answer 503 until a refresh fetches it.

  # The sandbox VM (round 5). Its controller is scraped as job "sandbox"; the API's own
  # counters of sandbox requests are api_sandbox_requests_total.
  - name: sandbox
    rules:
      - alert: SandboxDown
        expr: up{job="sandbox"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The sandbox controller is not answering its metrics port
          description: Runs, sessions, the browser tools and throwaway databases answer 503. See `journalctl -u sandboxd` on the sandbox VM.

      - alert: SandboxPaused
        expr: sandbox_paused{job="sandbox"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: The sandbox kill switch is on
          description: Nothing new starts while /etc/sandboxd/paused exists. Remove it to resume.

      # Runs that kept the processor busy until the time limit: what a miner looks like.
      - alert: SandboxMiningPattern
        expr: increase(sandbox_cpu_bound_timeouts_total{job="sandbox"}[30m]) >= 10
        labels:
          severity: warning
        annotations:
          summary: Many runs used the processor flat out until the time limit
          description: >-
            {{ $value }} in 30 minutes. Find the accounts in the audit log
            (STATE_DIR/audit on the API container: limitsHit time) and block them, or
            pause the service.

      - alert: SandboxBusy
        expr: sum(increase(sandbox_busy_total{job="sandbox"}[15m])) >= 20
        labels:
          severity: warning
        annotations:
          summary: Sandbox requests are being refused for want of memory
          description: The microVMs need more than MEMORY_CAP_MB, or someone is filling it.

      - alert: SandboxVMsFailing
        expr: |
          sum(increase(sandbox_vm_starts_total{job="sandbox",image_outcome=~".*/error"}[15m]))
            / clamp_min(sum(increase(sandbox_vm_starts_total{job="sandbox"}[15m])), 1) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than a fifth of microVMs fail to boot
