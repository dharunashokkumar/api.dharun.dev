# Advisories that osv-scanner (and OpenSSF Scorecard, which runs it) reports for a module
# this program does not use the affected part of. govulncheck in CI checks the code paths
# actually called and would report any of these if that changed.

# golang.org/x/crypto/openpgp is deprecated and has no fix, so every version of x/crypto
# matches. Only x/crypto/ocsp is linked (through pdfcpu's signature reader); `go mod why
# -m golang.org/x/crypto` shows the path.
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "Only golang.org/x/crypto/ocsp is used; the openpgp package is never imported."

# github.com/disintegration/imaging panics on a crafted TIFF (no fixed version). It is
# linked only through PocketBase's tools/filesystem (`go mod why -m
# github.com/disintegration/imaging`), which makes thumbnails of uploaded record files.
# The accounts collections have no file fields and the record API is not passed through
# (accountPassThrough), so no caller can send it a file.
[[IgnoredVulns]]
id = "GHSA-q7pp-wcgr-pffx"
reason = "Only reached through PocketBase file thumbnails; the accounts collections have no file fields and the record API is not exposed."
