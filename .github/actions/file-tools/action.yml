name: File tools
description: >-
  Installs the programs the file tools run: Tesseract, libvips, ffmpeg and poppler from
  Debian packages (as deploy/install.sh does on the server), and typst, piper, whisper.cpp,
  deep-filter and onnx-run (tools/fetch-tools.sh, as the release carries them). The
  downloaded packages and the built tools are cached, so only the first run after a change
  downloads and builds them. Sets TOOLS and REQUIRE_TOOLS and puts the tools on PATH.
runs:
  using: composite
  steps:
    - name: Restore the Debian packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        # Raise the number when the package list below changes.
        key: apt-${{ runner.os }}-2

    - name: Restore the downloaded and built tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/ci-tools
        key: tools-${{ runner.os }}-${{ hashFiles('tools/fetch-tools.sh') }}

    - name: Install
      shell: bash
      run: |
        # On 2026-11-11 the runners could not resolve any ubuntu.com name for hours, so apt
        # uses kernel.org's mirror, which carries the same archive, security updates
        # included. The runner image lists its mirrors in apt-mirrors.txt (mirror+file:),
        # not in the sources; both are pointed there before apt runs at all.
        echo "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i -E 's#https?://((azure\.)?archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
          /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
        # A stalled connection is dropped after 30 seconds and retried. Downloaded packages
        # are kept in the cached directory (apt deletes them by default), so the next run
        # downloads nothing.
        cat <<'CONF' | sudo tee /etc/apt/apt.conf.d/80-ci >/dev/null
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        APT::Keep-Downloaded-Packages "true";
        Binary::apt::APT::Keep-Downloaded-Packages "true";
        CONF
        mkdir -p ~/apt-archives/partial
        apt=(sudo apt-get -o Dir::Cache::Archives="$HOME/apt-archives")
        "${apt[@]}" update -q
        "${apt[@]}" install -y -q --no-install-recommends \
          tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tam tesseract-ocr-tel tesseract-ocr-kan \
          tesseract-ocr-mal tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-pan tesseract-ocr-ori tesseract-ocr-mar \
          libvips-tools libheif-plugin-aomenc ffmpeg poppler-utils
        sudo chown -R "$USER" ~/apt-archives
        echo "packages in the cache: $(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)"
        # Files already in the tools directory are kept, so a cached one is not built again.
        bash tools/fetch-tools.sh ~/ci-tools
        {
          echo "$HOME/ci-tools"
          echo "$HOME/ci-tools/piper"
          echo "$HOME/ci-tools/whisper"
          echo "$HOME/ci-tools/llama"
        } >> "$GITHUB_PATH"
        echo "TOOLS=$HOME/ci-tools" >> "$GITHUB_ENV"
        echo "REQUIRE_TOOLS=1" >> "$GITHUB_ENV"
