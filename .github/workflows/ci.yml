name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Validate logos and metadata
        run: npm run validate

      - name: Unit, API and updater tests
        run: npm test

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh tools/*.sh

      - name: Check the scraper compiles
        run: python3 -m py_compile tools/scrape_logo_metadata.py

      - name: Build the release bundle and smoke-test it
        run: |
          npm run build:release
          bash tools/smoke-test.sh dist/logos-api.tar.gz
