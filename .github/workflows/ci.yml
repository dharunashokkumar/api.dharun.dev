name: CI

# Every pull request and push is tested. A push to main that passes is also published as
# a release; servers running deploy/dharun-api-update.sh install it within two minutes.
# Nothing in this workflow connects to a server, and no dataset is fetched for a release:
# servers refresh their own. The install test fetches one small list to prove a server can.
# production.yml then waits until the release is live on the public site and checks it,
# so a release a server never installed, or rolled back, shows as a failed run there.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      - run: go vet ./...

      # With the pinned renderer at hand, PNG output of generated images is tested too.
      - name: Fetch the image renderer
        run: |
          bash tools/fetch-resvg.sh "$RUNNER_TEMP/tools"
          echo "RESVG=$RUNNER_TEMP/tools/resvg" >> "$GITHUB_ENV"

      # The file tools run outside programs: the server installs some with apt (as
      # deploy/install.sh does) and the release carries the rest. With all of them here,
      # REQUIRE_TOOLS makes a missing one a failure instead of a skipped test.
      - name: Install the programs the file tools run
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-tam tesseract-ocr-tel tesseract-ocr-kan \
            tesseract-ocr-mal tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-pan tesseract-ocr-ori tesseract-ocr-mar \
            libvips-tools libheif-plugin-aomenc ffmpeg poppler-utils
          bash tools/fetch-tools.sh "$RUNNER_TEMP/tools"
          {
            echo "$RUNNER_TEMP/tools"
            echo "$RUNNER_TEMP/tools/piper"
            echo "$RUNNER_TEMP/tools/whisper"
          } >> "$GITHUB_PATH"
          echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          echo "REQUIRE_TOOLS=1" >> "$GITHUB_ENV"

      - name: Unit, API, refresh and updater tests
        run: go test ./...

      # Hot reload, caches, the tokenizer's lazy vocabulary and the counters are shared
      # between requests; the race detector watches them under the same tests.
      - name: Race detector
        run: go test -race ./internal/...

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh tools/*.sh

      - name: Check the logo scraper compiles
        run: python3 -m py_compile tools/scrape_logo_metadata.py

      # Releases from main are numbered 1.1.<run>; anything else builds as a test version.
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "version=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release bundle from the full datasets and smoke-test it
        run: |
          bash tools/build-release.sh "${{ steps.version.outputs.version }}"
          bash tools/smoke-test.sh dist/dharun-api-linux-amd64.tar.gz

      # The real server cannot be tried from here, so a fresh Debian 13 with systemd stands
      # in for it: installer, updater, sandboxed service, refresh job.
      - name: Install the bundle on a fresh Debian 13
        run: bash tools/install-test.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/
          retention-days: 3

  # Known vulnerabilities in the code paths the program actually calls, in Go itself or
  # a dependency. Reported on every run; it does not hold back a release, since a fix may
  # need a Go or dependency upgrade first.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance: anyone can check that a bundle came from this workflow
      # and this commit with `gh attestation verify`.
      id-token: write
      attestations: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/dharun-api-linux-amd64.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            dist/dharun-api-linux-amd64.tar.gz dist/dharun-api-linux-amd64.tar.gz.sha256 dist/VERSION \
            dist/espeak-ng-source.tar.gz \
            --title "v$VERSION" --generate-notes

      # Servers only ever need the latest release and the few before it for a rollback.
      - name: Remove automatic releases beyond the newest 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v1\.1\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
