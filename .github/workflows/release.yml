name: Release

# Pushing a tag like v1.0.1 tests, builds and publishes a release. Servers running
# deploy/dharun-api-update.sh pick up the newest release on their own within minutes;
# nothing in this workflow connects to them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      - name: Build the release bundle and smoke-test it
        run: |
          bash tools/build-release.sh "${GITHUB_REF_NAME#v}"
          bash tools/smoke-test.sh dist/dharun-api-linux-amd64.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/dharun-api-linux-amd64.tar.gz dist/dharun-api-linux-amd64.tar.gz.sha256 dist/VERSION \
            --title "$GITHUB_REF_NAME" --generate-notes
