name: Scorecard

# OpenSSF Scorecard grades the repository's security practices (branch protection,
# pinned dependencies, token permissions, signed releases and more). Results go to the
# repository's code scanning page and to the public Scorecard API, which the README badge
# and api.dharun.dev/security link to. Read-only apart from those two uploads.
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # code scanning upload
      id-token: write # publishing the results
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
