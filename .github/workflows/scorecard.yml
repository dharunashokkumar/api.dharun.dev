name: Scorecard

# OpenSSF Scorecard grades the repository's security practices (branch protection,
# pinned dependencies, token permissions, signed releases and more). Results go to the
# repository's code scanning page and to the public Scorecard API, which the README badge
# and api.dharun.dev/security link to. Read-only apart from those two uploads.
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # code scanning upload
      id-token: write # publishing the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
